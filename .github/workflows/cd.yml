# NOTA OPERACIONAL: as credenciais do AWS Academy sao rotativas.
# Antes de cada deploy, atualize os secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY /
# AWS_SESSION_TOKEN. Runbook completo: aws-academy-setup.md no repo
# postech-sw-arch-p3-docs. Com o token vencido (sessao encerrada) o job
# `deploy` pula os passos AWS com aviso e termina verde; o `gate` roda sempre.
name: CD

on:
  push:
    branches: [main, homolog]

concurrency:
  group: terraform-${{ github.repository }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: uv sync

      - name: Gate (lint + typecheck + security + testes >= 95%)
        run: make check

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_JWT_SECRET }}
      TF_VAR_encryption_key: ${{ secrets.TF_VAR_ENCRYPTION_KEY }}
      TF_VAR_database_url: ${{ secrets.TF_VAR_DATABASE_URL }}
      TF_VAR_app_listener_arn: ${{ secrets.TF_VAR_APP_LISTENER_ARN }}
    steps:
      - uses: actions/checkout@v4

      # Secrets AWS ausentes OU vencidos (o token do Learner Lab dura ~4h e
      # continua gravado depois da sessao) = pular os passos AWS com aviso em
      # vez de falhar. Validacao via `sts get-caller-identity`, saida descartada.
      - id: aws
        name: Check AWS credentials
        run: |
          command -v aws >/dev/null || { echo "::error::aws cli ausente no runner; gate de credencial impossivel"; exit 1; }
          if [ -z "${AWS_ACCESS_KEY_ID}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "motivo=secrets AWS ausentes" >> "$GITHUB_OUTPUT"
          elif aws sts get-caller-identity >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "motivo=credenciais AWS vencidas ou invalidas (sessao do Academy encerrada)" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.aws.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - if: steps.aws.outputs.enabled == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - if: steps.aws.outputs.enabled == 'true'
        name: Empacotar lambda (deps + src)
        run: make build

      - if: steps.aws.outputs.enabled == 'true'
        name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - if: steps.aws.outputs.enabled == 'true'
        name: Terraform test
        run: terraform -chdir=terraform test

      # SEM workspaces, um unico state: os stages homolog e prod ja existem na
      # MESMA HTTP API (terraform/main.tf) e as functions tem function_name
      # fixo -- um workspace por branch tentaria criar uma segunda Lambda com
      # o mesmo nome (ResourceConflictException). Push em homolog ou em main
      # aplica o MESMO terraform (as duas stages sobem juntas); o que muda por
      # branch e apenas qual stage o summary/smoke referencia.
      - if: steps.aws.outputs.enabled == 'true'
        name: Terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve

      - if: steps.aws.outputs.enabled == 'true'
        name: Resumo do deploy (stage do branch)
        run: |
          STAGE=$([ "${GITHUB_REF_NAME}" = "main" ] && echo prod || echo homolog)
          URL=$(terraform -chdir=terraform output -raw "auth_url_${STAGE}")
          echo "Deploy aplicado (stages homolog e prod). Stage deste branch: ${STAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "POST /auth: ${URL}" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.aws.outputs.enabled != 'true'
        name: Notice (AWS skipped)
        run: echo "::notice::passos AWS pulados — ${{ steps.aws.outputs.motivo }}"

